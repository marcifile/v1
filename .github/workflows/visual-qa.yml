name: Visual production QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visual-qa.yml"

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Walk production UI
        env:
          BASE_URL: https://v1-production-76b1.up.railway.app
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const base = process.env.BASE_URL;
          const routes = ["/", "/creatures", "/ponds", "/hatch", "/docs", "/stats", "/log"];
          const errors = [];
          const report = [];

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (const route of routes) {
              const context = await browser.newContext({
                viewport: { width: 1536, height: 960 },
                deviceScaleFactor: 1,
              });
              const page = await context.newPage();
              const pageErrors = [];

              page.on("pageerror", (error) => pageErrors.push("pageerror: " + error.message));
              page.on("console", (msg) => {
                if (msg.type() === "error") pageErrors.push("console: " + msg.text());
              });
              page.on("requestfailed", (request) => {
                const failure = request.failure();
                pageErrors.push("requestfailed: " + request.url() + " :: " + (failure?.errorText || "unknown"));
              });

              const response = await page.goto(base + route, {
                waitUntil: "networkidle",
                timeout: 45000,
              });
              const status = response?.status() || 0;
              const title = await page.title();
              const bodyText = (await page.locator("body").innerText()).slice(0, 1000);
              const slug = route === "/" ? "home" : route.slice(1).replaceAll("/", "-");

              await page.screenshot({
                path: "visual-qa/" + slug + "-desktop.png",
                fullPage: true,
              });

              report.push({ route, status, title, pageErrors, bodyPreview: bodyText });
              if (status !== 200 || pageErrors.length) {
                errors.push({ route, status, pageErrors });
              }

              await context.close();
            }

            for (const route of ["/", "/hatch", "/creatures"]) {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                deviceScaleFactor: 1,
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on("pageerror", (error) => pageErrors.push("pageerror: " + error.message));
              page.on("console", (msg) => {
                if (msg.type() === "error") pageErrors.push("console: " + msg.text());
              });

              const response = await page.goto(base + route, {
                waitUntil: "networkidle",
                timeout: 45000,
              });
              const slug = route === "/" ? "home" : route.slice(1);
              await page.screenshot({
                path: "visual-qa/" + slug + "-mobile.png",
                fullPage: true,
              });
              report.push({
                route: route + " [mobile]",
                status: response?.status() || 0,
                pageErrors,
              });
              if ((response?.status() || 0) !== 200 || pageErrors.length) {
                errors.push({ route: route + " [mobile]", status: response?.status(), pageErrors });
              }
              await context.close();
            }

            await browser.close();
            fs.writeFileSync("visual-qa/report.json", JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));

            if (errors.length) {
              console.error("Visual QA errors:", JSON.stringify(errors, null, 2));
              process.exit(1);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pond-visual-qa
          path: visual-qa/
          retention-days: 7
